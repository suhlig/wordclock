[defaults]
inventory = inventory.yml
deprecation_warnings = false
interpreter_python = /usr/bin/python3
result_format = yaml
bin_ansible_callbacks = True

# First match wins: forked roles/collections in ~/workspace take precedence.
# Note: ansible-galaxy installs into the FIRST path of these lists; use
# --roles-path / --collections-path to install into ~/.ansible instead.
roles_path = ~/workspace/ansible-roles:~/workspace/nerab/ansible-roles:~/.ansible/roles
# roles_path = ~/.ansible/roles:~/workspace/ansible-roles:~/workspace/nerab/ansible-roles
collections_path = ~/workspace/ansible_collections/:~/.ansible/collections
# collections_path = ~/.ansible/collections:~/workspace/ansible_collections:~/workspace/nerab/ansible_collections
